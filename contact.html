<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NovaUI</title>
    <meta name="description" content="Get in touch with the NovaUI team. We are here to help you build your next big project.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <nav>
        <h2>NovaUI</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>Get in Touch</h1>
        <p>Have a question or want to work together? Fill out the form below and our team will get back to you shortly.</p>
    </div>

    <div class="contact-form">
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Form submitted! This is a demo.');">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="How can we help?" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>
            </div>

            <button type="submit" class="btn primary" style="width: 100%;">Send Message</button>
        </form>
    </div>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="faq.html">FAQ</a>
            <a href="blog.html">Blog</a>
            <a href="terms.html">Terms</a>
            <a href="privacy.html">Privacy</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="footer-copy">
            © 2026 NovaUI • Premium Web Interfaces • Built for Webmaster Verification
        </div>
    </footer>

</div>

</body>
</html>
